<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="omarchy-learn">
  <title>omarchy-learn</title>
  <desc>Original mark for omarchy-learn: the omarchy-wsl2 tiling panes with a question mark in the upper pane, denoting a learning assistant.</desc>

  <defs>
    <linearGradient id="lbadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2340"/>
      <stop offset="1" stop-color="#0D1120"/>
    </linearGradient>
    <linearGradient id="lmain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DDCC8"/>
      <stop offset="1" stop-color="#2AA6C4"/>
    </linearGradient>
    <linearGradient id="ltop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CF5"/>
      <stop offset="1" stop-color="#5B4BD6"/>
    </linearGradient>
    <linearGradient id="lbot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5A65B"/>
      <stop offset="1" stop-color="#E8842B"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#lbadge)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#7C6CF5" stroke-opacity="0.32" stroke-width="4"/>

  <rect x="80" y="112" width="196" height="288" rx="26" fill="url(#lmain)"/>
  <rect x="300" y="112" width="132" height="132" rx="26" fill="url(#ltop)"/>
  <rect x="300" y="268" width="132" height="132" rx="26" fill="url(#lbot)"/>

  <!-- terminal prompt in the primary pane -->
  <g stroke="#0D1120" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M132 212 L172 256 L132 300"/>
  </g>
  <rect x="188" y="286" width="56" height="18" rx="9" fill="#0D1120"/>

  <!-- question mark in the upper secondary pane: this is the "learn" mark -->
  <g fill="none" stroke="#0D1120" stroke-width="17" stroke-linecap="round">
    <path d="M343 156 a23 23 0 1 1 23 23 v14"/>
  </g>
  <circle cx="366" cy="215" r="10" fill="#0D1120"/>
</svg>
