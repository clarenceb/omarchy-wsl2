# /etc/wsl.conf - per-distro runtime settings for omarchy-wsl2.
# Reference: https://learn.microsoft.com/windows/wsl/wsl-config

[boot]
# Omarchy's bin/ scripts, user units and timers all assume systemd.
systemd=true

[user]
default=omarchy

[network]
hostname=omarchy
# Let WSL manage /etc/resolv.conf. Do NOT ship a resolv.conf in the rootfs.
generateResolvConf=true

[interop]
# Required so you can run notepad.exe, code.exe, explorer.exe from Omarchy.
enabled=true
appendWindowsPath=true

[automount]
enabled=true
root=/mnt/
options="metadata,umask=22,fmask=11"
