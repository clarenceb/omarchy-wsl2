# /etc/wsl-distribution.conf - install-time metadata for omarchy-wsl2.
# Reference: https://learn.microsoft.com/windows/wsl/build-custom-distro
#
# Must be root:root 0644.

[oobe]
# Runs on the first interactive shell. A non-zero exit stops WSL opening a
# shell at all, so oobe.sh must always end with `exit 0`.
command = /etc/oobe.sh
# 1001, not 1000: WSL2 shares one cgroup namespace across distros, so a
# uid clash with another running distro breaks the systemd user session.
defaultUid = 1001
# defaultName is REQUIRED for the double-click .wsl install experience.
defaultName = omarchy

[shortcut]
enabled = true
icon = /usr/lib/wsl/omarchy-wsl2.ico

[windowsterminal]
enabled = true
profileTemplate = /usr/lib/wsl/terminal-profile.json
